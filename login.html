<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="theme-color" content="#171715">
        <title>Acceso administrativo | Allende</title>
        <link rel="icon" href="images/logo.png">
        <link rel="stylesheet" href="css/login.css">
    </head>
    <body>
        <a class="skip-link" href="#contenido">Saltar al contenido</a>
        <header id="site-header" class="site-header">
            <div class="container header-inner">
                <button class="brand" id="menu-toggle" type="button" aria-controls="side-menu" aria-expanded="false" aria-label="Abrir menú lateral">
                    <img src="images/logo.png" alt="Logo de Pizzas a la leña Allende">
                    <span>
                        <strong>ALLENDE</strong>
                        <small>PIZZAS A LA LEÑA</small>
                    </span>
                </button>
                <nav id="public-nav" class="site-nav" aria-label="Principal">
                    <a href="index.html#inicio">Inicio</a>
                    <a href="index.html#menu">Menú</a>
                    <a href="index.html#promociones">Promociones</a>
                    <a href="index.html#nosotros">Nosotros</a>
                    <a href="index.html#contacto">Contacto</a>
                </nav>
                <div class="header-actions">
                    <a class="button" href="pedido.html">Pedir ahora</a>
                </div>
            </div>
        </header>
        <div class="menu-overlay" id="menu-overlay" aria-hidden="true"></div>
        <aside class="side-menu" id="side-menu" aria-label="Menú principal" aria-hidden="true">
            <div class="side-menu-header">
                <span>Menú</span>
                <button class="side-menu-close" id="menu-close" type="button" aria-label="Cerrar menú lateral">×</button>
            </div>
            <nav>
                <a href="index.html#inicio">Inicio</a>
                <a href="index.html#menu">Menú</a>
                <a href="pedido.html">Mi pedido</a>
                <a href="login.html">Administrador</a>
            </nav>
        </aside>
        <main id="contenido">
            <div class="login-wrap">
                <section class="card login-card">
                    <h1>Iniciar sesión</h1>
                    <p>Accede al panel de administración de Allende.</p>
                    <form id="login-form">
                        <div class="field">
                            <label for="usuario">Usuario</label>
                            <input id="usuario" name="usuario" type="text" required="" autocomplete="username" value="" placeholder="Ingresa tu usuario">
                        </div>
                        <div class="field">
                            <label for="password">Contraseña</label>
                            <div class="password-wrap">
                                <input type="password" name="password" id="password" required="" autocomplete="current-password" placeholder="Ingresa tu contraseña">
                            </div>
                        </div>
                        <p id="login-error" class="form-error" role="alert"></p>
                        <a class="button full" href="admin/html/index.html">Ingresar</a>
                    </form>
                    <a href="index.html">← Volver al sitio</a>
                </section>
            </div>
        </main>
        <footer id="site-footer" class="site-footer">
            <div class="container footer-inner">
                <a class="brand" href="index.html">
                    <img src="images/logo.png" alt="Logo de Pizzas a la leña Allende">
                    <span>
                        <strong>ALLENDE</strong>
                        <small>PIZZAS A LA LEÑA</small>
                    </span>
                </a>
                <div class="actions">
                    <a href="index.html#contacto">Contacto</a>
                </div>
                <p>Pizzas a la leña Allende · Ciudad Hidalgo, Michoacán</p>
            </div>
        </footer>
        <script src="js/catalogo-pedido.js"></script>
        <script src="js/menu.js"></script>
    </body>
</html>
